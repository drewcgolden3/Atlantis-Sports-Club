<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Retired page, kept so old QR codes and printed links still land somewhere.
       The title says so plainly rather than shadowing memberships.html — the two
       were identical, which made them impossible to tell apart in a tab or a
       history list. It is noindexed and canonicals to memberships.html below. -->
  <title>Founding Member Presale (moved) — Atlantis Sports Club</title>
  <!-- The presale page has been replaced by the three-level Membership Options
       page. This file stays put and forwards, because printed material, ads and
       older links still point at /presale.html — those visitors must land on the
       new pricing rather than a 404. Any ?utm_… or ?src= tags come along too, so
       campaign and QR attribution survives the hop. -->
  <link rel="canonical" href="https://atlantissportsclubhyannis.com/memberships.html" />
  <meta name="robots" content="noindex, follow" />
  <script>
    (function () {
      var target = "memberships.html" + window.location.search + (window.location.hash || "");
      window.location.replace(target);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=memberships.html" /></noscript>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; display: grid; place-items: center;
           min-height: 100dvh; margin: 0; color: #0B2233; text-align: center; padding: 24px; }
    a { color: #0369A1; }
  </style>
</head>
<body>
  <main>
    <p>Taking you to our membership options&hellip;</p>
    <p><a href="memberships.html">Continue to Membership Options</a></p>
  </main>
</body>
</html>
